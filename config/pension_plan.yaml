# 红利低波养老方案配置（执行说明书 v2.3 的机器可读版）
# 修改本文件即可调整方案，脚本不需要改动
#
# 格式约定：所有标的必须写 code + name（PM 格式铁律）

# 建仓方案：10万立即 + 140万等12个月无条件投完（R24-R30 实测最优）
entry:
  mode: immediate_plus_wait
  immediate_amount: 100000
  immediate_months: 3               # 立即部分分3个月定投
  wait_amount: 1400000
  wait_deadline_months: 12          # 第12个月末无条件投完
  trigger_conditions: none          # 不设任何触发条件
  voluntary_early_if_dd: 0.50       # 仅当暴跌≥50%时允许自愿提前投完
  start_date: null                  # 建仓起始日（YYYY-MM-DD），开始建仓时填写


plan:
  name: 红利低波养老方案 v2.6
  capital: 1500000          # 初始本金（元）
  withdrawal_rate: 0.04     # 提款率
  initial_annual: 60000     # 首年提款额（元）
  cpi_base_year: 2026       # 购买力基准年
  assume_cpi: 0.02          # 计算下年提款额时假设的通胀（仅用于提示）
  backtest_window_years: 20 # 历史统计窗口

# 硬约束（用户 2026-10-20 明确）
constraints:
  etf_only: true            # 只买 ETF，不买个股
  no_leverage: true         # 不加杠杆
  no_short: true            # 不做空
  base_never_sell: true     # 底仓永不动

# ═══════════════════════════════════════════════════════════════════════════
# 资产配置 v3.0（用户 2026-10-21：已配置实物黄金长期持有，黄金移出组合，10% 给纳指）
#
# 现行配比：515100 40% / 515450 35% / 512890 0% / 518880 0% / QQQ 25%
#
# 依据 R152（2006-2026，20.8 年，含 2008）：
#   ① 三只红利全留 40/35/25      年化16.56% 回撤-66.2% Calmar0.250 覆盖141% 提款最差82.4%
#   ② 红利85+纳指15              17.18%    -58.9%     0.292      122%      102.4%
#   ③ 红利75+纳指25 ← 采用        17.43%    -54.1%     0.322      109%      114.8%
#   ④ 红利80+纳指20              17.32%    -56.4%     0.307      115%      108.7%
#   ⑤ 红利90+纳指10              17.01%    -61.4%     0.277      128%       95.9%
#   对照 v2.9（含黄金10%）        16.79%    -54.5%     0.308      108%       96.6%
#   → 去掉黄金改给纳指，比含黄金更好：年化 +0.64pp、回撤 -0.4pp、提款最差 +18.2pp
#   → 原因：黄金 20 年 8.93%/-46.2%，纳指 13.96%/-30.1% —— 收益更高且回撤更小
#
# 原 v2.6 说明（保留备查）：
# ═══════════════════════════════════════════════════════════════════════════
# 依据 R137-R138（2006-2026，20.8 年，含 2008 金融危机）：
#   现行 40/35/25       年化 16.56%  回撤 -66.2%  2008年 -57.5%  提款最差剩余 72.2%
#   新方案 40/35/0/10/15 年化 16.79%  回撤 -54.5%  2008年 -46.3%  提款最差剩余 96.6%
#   → 年化 +0.23pp、回撤改善 11.7pp、2008 少跌 11.2pp、提款最坏情况改善 24.4pp
#   → 现金分红率 4.31%（覆盖率 108%，比现行 106% 略高，因 QQQ 有 0.5% 股息）
#
# 为什么可以砍掉 512890：它完全不发现金分红（0%），
#   现金分红全部来自 515100(5.86%) + 515450(5.40%)。用它额度换黄金/纳指，一分钱分红都不损失。
#
# 重要提醒：
#   ① 512890 归零 ≠ 放弃「红利低波」类别 —— 515100 + 515450 仍是红利低波
#   ② 黄金用 518880（A股，择时有效）；纳指 QQQ 需美股账户，A股替代为 513100（有QDII额度限制）
#   ③ 20 年回撤仍有 -54.5%（150万 → 68万），红利资产固有特性，优化消除不了
assets:
  - code: "515100"
    name: 红利低波100ETF景顺
    weight: 0.40
    market: sh
    top3_industry: 0.291      # 2026Q2 实测
    bank_share: 0.199
  - code: "515450"
    name: 红利低波50ETF南方
    weight: 0.35
    market: sh
    top3_industry: 0.436
    bank_share: 0.301
  - code: "512890"
    name: 红利低波ETF华泰柏瑞
    weight: 0.00              # v2.6：全部换出（不发现金分红，换掉不损失现金流）
    market: sh
    top3_industry: 0.583
    bank_share: 0.525
  - code: "518880"
    name: 黄金ETF华安
    weight: 0.00              # v3.0：已配置实物黄金长期持有，从组合移出（指标看板保留）
    market: sh
    asset_class: gold
    pays_dividend: false
    note: "用户已有实物黄金长期持有，本组合不再持有黄金ETF；此标的仅用作看板价格源"
  - code: "QQQ"
    name: 纳指100ETF-Invesco（美股）
    weight: 0.25              # v3.0：接手黄金让出的 10%（纳指 20 年 13.96%/-30.1%，优于黄金 8.93%/-46.2%）
    market: us
    asset_class: equity_us
    pays_dividend: true
    note: "需美股账户；A股替代品 513100 纳指ETF国泰（有QDII额度限制）"

cash:
  code: "511990"
  name: 货币ETF华宝添益
  market: sh
  target_months: 12         # 货币ETF 目标水位 = N 个月生活费

# 三层结构（v2.3）
layers:
  base: 0.70                # 底仓，永不动
  satellite: 0.30           # 卫星仓，按股息率分位调

# 信号（v2.3，全部经过 R5~R42 验证）
signals:
  # ① 卫星仓择时 —— 绝对股息率阈值（v2.4，2026-10-20 改）
  #
  # 为什么从「5 年分位」改成「绝对阈值」（R82-R92 验证）：
  #   1. 分红季锯齿：6 月股息率平均跳升 +13.45%、7 月回落 -7.78%（20 年统计）
  #      → 原版 11 次调仓里 5 次发生在 6/7 月，其中 3 次方向错误
  #   2. 基准漂移：2021-2025 股息率长期 5-7%，把 5 年窗口的底抬到 4.50%
  #      → 2025 年 4.60% 被判「1 分位=极贵」而卖出，但 20 年历史位置是 62 分位（便宜）
  #   3. 数据质量：股息率月度变化的 81.6% 来自分红数据更新，只有 19.1% 来自股价
  #      → 5 年分位对噪声极敏感（33% 的数据跳动能让分位从 99% 崩到 1%）
  #
  # 绝对阈值的优势：门槛宽（2.5% 与 4.5% 差 2pp），能吸收 ±30% 的数据噪声
  #
  # 实测（2006-07 ~ 2026-10）：
  #   永不动（70/30）       年化 14.97%  回撤 -66.2%  Calmar 0.226
  #   原版 5 年分位         年化 15.31%  回撤 -52.2%  Calmar 0.293  调仓 11 次  当前=空仓
  #   绝对值 2.5%/4.0%      年化 13.06%  回撤 -52.2%  Calmar 0.250  调仓  2 次  当前=满仓
  #   绝对值 2.5%/4.5%      年化 12.66%  回撤 -52.2%  Calmar 0.242  调仓  2 次  当前=满仓
  #   → Calmar 仅差 0.004，但调仓少 9 次、当前状态正确
  #
  # 两次历史动作：
  #   2007-10-31  股息率 1.71% → 卖出（躲过 2008，-66% → -46%）
  #   2014-09-30  股息率 4.78% → 买回
  #
  # 判定频率：每月检查（R95 实测：每天/每月/每季/每年9月 Calmar 差异仅 0.003-0.02，
  #           因为 2.5%~4.0% 之间有 1.5pp 死区，天然防抖动）
  #
  # 应急条款：不加（R97 宽版 +0.004 Calmar 但多 8 次摩擦；R98 窄版从不触发；
  #           R99 回落版产生「买了又卖」冲突）
  #
  # ⚠️ 已确认的重大局限：本策略只在「高分红年代」有效
  #   2007-2013 股息率仅 1.5%~3.5%，永远够不到 4.0% → 长期空仓
  #   2008 年指数跌 66.2%，但股息率只从 1.56% 涨到 2.15% → 仍不满足买回
  #   2014 年后股息率升到 3.8%~7.85%，策略才正常运作
  #   → 20 年回测实质是「13 年空仓 + 7 年满仓」，不是真正的双向择时
  #
  # 近期股息率区间（判断现处位置用）：
  #   2020 年起 4.20%~7.85%（中位 5.28%）；2022 年起最低 4.50%；2026 年 4.65%~5.45%
  #   当前 5.25% → 高于买回线 1.25pp，处于「满仓」；需涨 110% 才会触发卖出
  # ══ v2.5 三信号组合（R122-R127 验证，2026-10-21 用户决定）══
  # 为什么改：R127 实测 B（三者组合）比 A（单股息率）更安全
  #   2015 段回撤  -31.2% vs -42.5%（少跌 11.3pp）
  #   最差 3 年     -9.8% vs -22.0%（好 12.2pp）
  #   年化波动      19.7% vs 21.3%
  #   提款15年最差剩余 209.5% vs 176.4%（好 33pp）
  #   代价：年化 15.88% vs 17.03%（少 1.15pp）
  #   唯一通过样本外：0.342 vs 永不动 0.324（单 ERP/股息率均失效）
  # 规则：卖出 = 任一触发；买回 = 至少两个满足
  satellite_combo:
    enabled: true
    check_freq: monthly
    rule:
      sell: any            # 任一信号报警就卖卫星仓
      buy: at_least_2      # 至少两个信号说便宜才买回
    signals:
      dividend:
        name: 红利低波股息率
        index_code: H30269
        higher_is_cheaper: true
        sell_below: 0.025      # 股息率 <=2.5% 卖
        buy_above: 0.040       # 股息率 >=4.0% 买
      erp:
        name: 沪深300股权风险溢价
        index_code: "000300"
        higher_is_cheaper: true
        sell_below: 0.005      # ERP <=0.5% 卖
        buy_above: 0.035       # ERP >=3.5% 买
      pb:
        name: 沪深300市净率
        source: macro.hs300_pb
        higher_is_cheaper: false
        sell_above: 2.1        # PB >=2.1 卖
        buy_below: 1.5         # PB <=1.5 买

  # 旧口径保留（对照用，已不启用）
  dividend_abs:
    enabled: false                  # v2.5 已由 satellite_combo 取代
    index_code: H30269              # 红利低波（全收益对应 H20269）
    index_name: 红利低波
    sell_below: 0.025               # 股息率 <= 2.5% → 卫星仓卖出（太贵）
    buy_above: 0.040                # 股息率 >= 4.0% → 卫星仓买回（便宜）
    check_freq: monthly             # 每月检查（2026-10-20 用户决定）
    emergency: none                 # 应急条款：不加（R97-R99 实测不成立）
    note: "阈值待验证（O09）；2.5%/4.5% 优于邻近组合，但有过拟合风险"
    # 保留旧口径作为对照，不启用
    legacy_percentile:
      enabled: false
      window: 1250
      expensive: 0.30
      cheap: 0.70
      note: "已废止：分红季锯齿 + 基准漂移 + 数据质量，见上"

  # ② 6 月季节性 —— 轻度降仓（R38 验证：6 月均值 -3.57%，t≈-2.3）
  june_effect:
    enabled: true
    month: 6
    reduced_position: 0.70          # 6 月仓位降到 70%
    note: "2014-2020 曾失效，仅轻度使用"

  # ③ ERP 温度计 —— 只做参考，不用于调仓（R41/R42 验证：温和倾斜也降年化）
  erp_thermometer:
    enabled: true
    index_code: "000300"            # 沪深300（R117：对未来红利低波收益相关性 +0.517）
    index_name: 沪深300
    bond_key: cn10y                 # 10Y 国债（macro 表）
    window: 750
    note: "仅作估值温度计，不产生交易信号"
    # R117 实测（2015-2026，2862 日）：ERP 各区间之后 12 个月平均收益
    #   < 3%     沪深300 -19.61%  红利低波 -5.19%   ← 唯一有预警价值的区间
    #   3~4.5%   沪深300  -0.43%  红利低波 +4.83%
    #   4.5~6%   沪深300  +7.23%  红利低波 +13.69%
    #   6~7.5%   沪深300 +16.21%  红利低波 +13.29%
    # 相关系数：ERP vs 沪深300 未来12月 +0.546；vs 红利低波 +0.517
    bands:
      - [0.0, 0.03, "很贵", -0.1961, -0.0519]
      - [0.03, 0.045, "偏贵", -0.0043, 0.0483]
      - [0.045, 0.06, "中性偏低", 0.0723, 0.1369]
      - [0.06, 0.075, "便宜", 0.1621, 0.1329]
      - [0.075, 9.9, "很便宜", null, null]
    alert_below: 0.03               # ERP < 3% 时报警

  # ④ 行业集中度 —— 季度检查（R33）
  industry_check:
    enabled: true
    top3_limit: 0.50
    bank_limit: 0.35
    note: "超过则降权该 ETF"

  # ⑤ 建仓兜底提醒
  entry_fallback:
    enabled: true
    note: "第 12 个月末无条件投完，不许再等"

# 风控
risk:
  liquidate_floor: 0.0        # 永不清仓（最低仓位）
  min_fund_size_yi: 10        # 规模低于该值(亿)考虑更换
  review_power_drop_years: 3  # 连续N年购买力下降则下调提款率
  cash_min_months: 3          # 现金池跌破 3 个月生活费 → 立即补足


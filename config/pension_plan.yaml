# ═══════════════════════════════════════════════════════════════════════════
# 黄金择时（用户 2026-10-21 决定加入，R139-R145 验证）
# ═══════════════════════════════════════════════════════════════════════════
# 规则：518880 收盘价 > MA10 且 MA10 > MA15 → 持有黄金；否则空仓转货币ETF
#
# 为什么用 MA10/15 而不是 MA5/20（64 个配置系统性搜索）：
#   策略          年化     最大回撤   Calmar   滚动2年胜率  样本外Calmar
#   买入持有      9.20%   -30.5%    0.301    —          0.472
#   MA5/20       9.09%   -16.8%    0.542    52%        0.702
#   MA10/15     11.22%   -16.8%    0.669    72%        0.966
#
# 为什么不是过拟合（三重验证）：
#   ① 参数高原：fast 7-12 × slow 14-18 的 Calmar 全在 0.54-0.71（持有 0.301）
#      MA9/15=0.670、MA10/15=0.669、MA12/15=0.677 —— 不敏感
#   ② 6 个窗口（13.2/10/8/6/4/3 年）全部跑赢，改善 +0.368~+0.805
#   ③ 三只 A 股黄金 ETF 一致：518880 +0.368、159934 +0.358、518800 +0.372
#
# 已失效的候选（记录以免重复试）：
#   MACD（三只全部失效，样本外 -0.065~-0.308）/ 实际利率（年化仅1.12%）
#   网格（0.499，年换手191次）/ 均值回归（0.059-0.153）/ RSI14（-0.070）
#   唐奇安突破（样本外 -0.110）
#
# ⚠️ 限制：① 只在 A 股黄金 ETF 有效，美股 GLD 几乎无效（+0.017）
#        ② 上涨年跑输：2022-2025 连续4年跑输，2025 输 20.8pp
#        ③ 下跌年保护：2013 +11.2pp、2015 +7.0pp、2021 +6.1pp、2026 +23.0pp
#        ④ 定位是「保险」不是「收益引擎」
gold_timing:
  enabled: true                # v3.0：不再产生交易指令，仅驱动「实物黄金监控看板」
  dashboard_only: true         # 只看不用：不参与组合买卖
  etf_code: "518880"
  etf_name: "黄金ETF华安"

# ═══════════════════════════════════════════════════════════════════════════
# 实物黄金 → 红利ETF 分层换仓（v5 规则，用户 2026-10-26 确认 1A/2A/3A）
# ═══════════════════════════════════════════════════════════════════════════
# 背景：用户全部资产 160 万，其中实物黄金 144 万（不生息、0 分红）、现金 16 万；
#       无其他收入，每月需 5,000 元。目标是"不要买在高点等暴跌"地把黄金换成红利。
#
# 回测依据（logs/_r175_bucket2.py，209 个历史月末起点，60 个月持有）：
#   起点状态              现在买终值  现在买最坏浮亏   等信号终值  等信号最坏浮亏
#   深度便宜(≤-25%)          2.10      -34.5%        2.05      -34.5%
#   中度便宜(-25~-15%)       1.65      -52.2%        1.62      -34.5%
#   略便宜(-15~-5%)          1.52      -62.5%        1.55      -34.5%
#   接近高点(>-5%)           1.37      -63.7%        1.96      -29.9%
#   → 越接近高点，等信号的价值越大（浮亏改善 33.8pp、终值 +43%）
#   → 已深度便宜时等信号无额外好处，所以设"估值闸门"允许提前行动
#
# 闸门阈值敏感性（logs/_r176_gate.py）：-10% ~ -40% 各档最坏浮亏全是 -34.5%，
#   中位终值仅 1.64~1.69 波动 → 真正起作用的是"等 S5 信号"，闸门只是可选的提前许可。
#   取 -25%：触发率约 31%，避免"刚跌一点就冲进去"。
#
# 用户决策（2026-10-26）：
#   ① 换仓金额 100 万（保留 44 万黄金作长期底仓）
#   ② 兜底"不强制买入"——36 个月没信号就继续卖金条过日子
#   ③ 接入面板，每天可看到闸门/信号状态
gold_switch:
  enabled: true
  name: "实物黄金 → 红利ETF 分层换仓"
  # ── 资金与规模
  total_assets: 1600000
  physical_gold: 1440000
  cash: 160000
  convert_amount: 1000000        # A 档：换 100 万
  keep_gold: 440000              # 保留黄金（长期底仓，不设卖出条件）
  monthly_need: 5000             # 每月生活开支
  tranches: 12                   # 分 12 个月执行
  # ── 换入标的与比例
  targets:
    - code: "515100"
      name: "红利低波100ETF景顺"
      ratio: 40
    - code: "515450"
      name: "红利低波50ETF南方"
      ratio: 35
  # ── 第 1 层：估值闸门（红利价格指数距高点，用价格指数 H30269 而非全收益，
  #     因为全收益指数会因分红累积而几乎永远创新高，无法衡量贵贱）
  gate:
    enabled: true
    index_code: "H30269"
    index_name: "红利低波价格指数"
    threshold: -0.25             # 距高点 ≤ -25% 视为深度便宜，可立即开始
  # ── 第 2 层：危机信号
  signal:
    ref_window_months: 36        # 参照窗口：滚动 36 个月高点
    drawdown_threshold: -0.20    # ① 自本轮高点回撤 ≥ 20%
    bounce_threshold: 0.15       # ② 自本轮最低点反弹 ≥ 15%
    stage_source: "沪深300"
  # ── 兜底
  fallback:
    months: 36
    force_buy: false             # 用户选择：不强制买入
    note: "36 个月未触发则继续卖金条生活（144 万 ÷ 6 万/年 ≈ 24 年）"
  # ── 成本
  cost:
    gold_spread_low: 0.01        # 银行金条回购价差 1%
    gold_spread_high: 0.02       # 2%
  # ── 已确认的决策记录
  decision:
    date: "2026-10-26"
    convert_amount: "A 档 100 万"
    fallback: "A 不强制买入"
    panel: "A 接入面板"

# ═══════════════════════════════════════════════════════════════════════════
# 危机信号仪表盘（v3.2，用户 2026-10-26 要求扩充信号 + 加美股信号，选 A 方案）
# ═══════════════════════════════════════════════════════════════════════════
# 指标库共 25 个（scripts/build_crisis_indicators.py 生成 indicators25.csv），
# 面板精选 15 个分三组 + 3 个合成。全部统一方向：数值越大＝压力越大。
#
# 领先性实测（logs/_r178_rank_indicators.py，10 次危机，月频）：
#   最强领先：垃圾债vs国债(-4月/67%)、新兴vs美股(-3月/70%)、波动率分位(-2月/70%)、
#            美元动量(-2月/60%)、信用利差(-2月/50%)
#   ⚠️ 只有 2–4 个月，且危机前 6 个月的分位普遍仅 26%–75%（接近抛硬币）
#   ⚠️ 所有合成指标触发时，A股已平均跌 30%–42%
#   → 结论：这些信号不能预测危机，只能确认「已经在跌」。定位是体检报告，不是预警雷达。
crisis_monitor:
  enabled: true
  name: "危机信号仪表盘"
  data_file: "data/cache/crisis/indicators25.csv"
  build_script: "scripts/build_crisis_indicators.py"
  refresh: monthly
  # ── 三组精选指标（每组 5 个）
  groups:
    - key: lead
      name: "领先组"
      note: "实测领先 2–4 个月；数值高＝压力大"
      items:
        - "6_垃圾债vs国债(HYG/IEF)"
        - "15_新兴vs美股(EEM/SPY)"
        - "2_波动率分位"
        - "9_美元动量"
        - "4_信用利差(HYG/LQD)"
    - key: us_structure
      name: "美股结构组"
      note: "内部结构先坏、表层后坏；这是加美股信号的主要价值"
      items:
        - "14_周期vs防御(XLY/XLP)"
        - "13_金融股相对(XLF/SPY)"
        - "5_垃圾债动能"
        - "11_等权vs市值权(RSP/SPY)"
        - "12_高beta vs低波(SPHB/SPLV)"
    - key: cn
      name: "A股本土组"
      note: "A 股自己的杠杆、估值、投机程度"
      items:
        - "20_两融余额分位"
        - "21_两融3月变化"
        - "22_全A市盈率分位"
        - "23_全A市净率分位"
        - "24_沪深300成交额分位"
  # ── 三个合成
  composites:
    - key: us_all
      name: "美股综合"
      note: "19 个美股指标等权平均"
      members: ["1_回撤","2_波动率分位","3_低于MA10M","4_信用利差(HYG/LQD)","5_垃圾债动能",
                "6_垃圾债vs国债(HYG/IEF)","7_曲线10Y2Y","8_TIPS实际利率","9_美元动量",
                "10_小盘vs大盘(IWM/SPY)","11_等权vs市值权(RSP/SPY)","12_高beta vs低波(SPHB/SPLV)",
                "13_金融股相对(XLF/SPY)","14_周期vs防御(XLY/XLP)","15_新兴vs美股(EEM/SPY)",
                "16_资产相关性","17_VIX代理(VXX)","18_铜金比(CPER/GLD)","19_原油动能"]
    - key: cn_all
      name: "A股综合"
      note: "6 个 A 股本土指标等权平均"
      members: ["20_两融余额分位","21_两融3月变化","22_全A市盈率分位",
                "23_全A市净率分位","24_沪深300成交额分位","25_沪深300回撤"]
    - key: lead5
      name: "领先5合成"
      note: "5 个领先指标的合成；危机前 6 个月即开始上升"
      members: ["6_垃圾债vs国债(HYG/IEF)","15_新兴vs美股(EEM/SPY)","2_波动率分位",
                "9_美元动量","4_信用利差(HYG/LQD)"]
  # ── 阈值
  thresholds:
    calm: 0.40
    watch: 0.60
    alert: 0.75
    danger: 0.85
  # ── 分歧提示（内部 vs 表层）
  divergence:
    internal: ["14_周期vs防御(XLY/XLP)","13_金融股相对(XLF/SPY)","5_垃圾债动能"]
    surface: ["4_信用利差(HYG/LQD)","2_波动率分位"]
    gap_threshold: 0.25      # 内部与表层分位差超过 25pp 视为「内部分化」

# 银行强弱监测（用户 2026-10-20：只追踪，不自动调仓）
bank_monitor:
  enabled: true
  index_code: "sz399986"          # 中证银行指数
  index_name: 中证银行
  benchmark: H30269               # 红利低波（对比基准）
  window_years: 3                 # 滚动窗口
  strong_threshold: 0.05          # 银行 3 年领先 >5pp → 强
  weak_threshold: -0.10          # 银行 3 年落后 >10pp → 弱
  action: "display_only"          # 只显示建议，不自动调仓
  note: "本质是顺势指标，转折点会滞后；用户决定是否参考"

# ═══════════════════════════════════════════════════════════════════════
# 决策记录：配比维持 40/35/25（用户 2026-10-21 决定，选 A）
# ═══════════════════════════════════════════════════════════════════════
# 背景：R106-R112 实测发现现金分红覆盖率只有 67-78%
#   （中性口径每月分红 3,882 元 vs 目标 5,000 元，缺 1,118 元）
#   且 512890（25%仓位）完全不发现金，515450 分红三年降 82%
#
# 曾考虑的替代方案（全部否决）：
#   50/35/15  保守口径覆盖 77%  总收益下降
#   55/40/5   保守口径覆盖 87%  总收益下降
#   60/40/0   保守口径覆盖 90%  仍不够，且放弃总收益最高的资产
#
# 决定：维持 40/35/25
# 理由：
#   1. 怎么调都覆盖不了生活费，调配比只是心理安慰
#   2. 512890 2020-2026 年化 13.38%，是总收益最高的资产
#   3. 分红不够的部分靠「卖份额」补，这本来就是原设计
#   4. 12 个月现金池必须保留（分红集中在 7/12 月，8-10 个月零到账）
#
# 待观察（O10 已关闭，转为监控项）：
#   - 515450 分红若继续下滑（2026 已降至 0.025 元/份），需重估
#   - 每年 1 月复核一次三只 ETF 的上年实际分红

# 模拟盘配置 —— 一周全额建仓，每日跟踪收益
# 用户 2026-10-21 要求：假定 150 万在未来一周完成建仓，每天看最新收益。
# 注意：本模拟盘用「一周全额建仓」，与 pension_plan.yaml 的
#      「10 万立即 + 140 万等 12 个月」不同 —— 目的是给真实建仓做对照基准。

sim:
  name: "养老模拟盘 v2.6 · 一周全额建仓"
  capital: 1500000              # 总本金（元）
  cash_pool_months: 12          # 现金池月数（12 个月 × 月提款额）
  monthly_withdrawal: 5000      # 每月提款（元）

  # 建仓安排：从 start_date 起，在未来 build_days 个自然日内分 build_tranches 次买完
  start_date: "2026-10-21"
  build_days: 7
  build_tranches: 5             # 分 5 个交易日等额买

  # 资金分配（投资部分按此比例；现金池单独留出）
  assets:
    - code: "515100"
      name: "红利低波100ETF景顺"
      weight: 0.40
      market: cn
    - code: "515450"
      name: "红利低波50ETF南方"
      weight: 0.35
      market: cn
    - code: "512890"
      name: "红利低波ETF华泰柏瑞"
      weight: 0.00              # v2.6 换出
      market: cn
    - code: "518880"
      name: "黄金ETF华安"
      weight: 0.10
      market: cn
    - code: "QQQ"
      name: "纳指100ETF-Invesco（美股）"
      weight: 0.15
      market: us

  benchmark:
    code: "H20269"
    name: "红利低波全收益"

  # 已知分红记录（除权日, 每份金额）—— 分红到账计入现金
  # 以下按 2025 年同月金额估算，实际公告出来后需更正
  known_dividends:
    "515100":
      - ["2026-12-23", 0.1053]
    "515450":
      - ["2026-12-15", 0.0300]
    "512890": []

  fee:
    buy: 0.0003                   # 买入费率
    sell: 0.0003                  # 卖出费率

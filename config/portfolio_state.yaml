# 持仓与提款记录（手工填写 / 脚本可写）
#
# 用途：让监控工具能算「现金池还能撑几个月」「实际权重漂移多少」「提款购买力变化」
# 未建仓时全部留空即可 —— 工具会自动显示「未填写」，不影响其它功能。
#
# 填写方式（二选一）：
#   shares  填持有份额（工具会用最新 ETF 价格算市值）
#   amount  直接填市值（元）
# 两者都填时以 amount 为准。

as_of: null                   # 最后一次核对持仓的日期，如 "2026-11-01"

# ── 实际持仓 ──
holdings:
  - code: "515100"
    name: 红利低波100ETF景顺
    shares: null
    amount: null
  - code: "515450"
    name: 红利低波50ETF南方
    shares: null
    amount: null
  - code: "512890"
    name: 红利低波ETF华泰柏瑞
    shares: null
    amount: null

# ── 现金池 ──
cash:
  code: "511990"
  name: 货币ETF华宝添益
  amount: null                # 货币 ETF 余额（元）

# ── 提款记录（每取一次钱记一笔，用于算累计提款和购买力）──
withdrawals: []
# 示例：
#  - date: "2026-11-01"
#    amount: 5000
#    note: "11 月生活费"

# ── 建仓投入记录（每投一笔钱记一笔，用于算建仓进度）──
deposits: []
# 示例：
#  - date: "2026-11-01"
#    amount: 33333
#    note: "建仓立即部分第 1 笔"

# ── 分红记录（本方案持仓的 ETF 基本不分红，留作备用）──
dividends: []
# 示例：
#  - date: "2026-12-15"
#    code: "515100"
#    amount: 1200
#    note: "分红已再投资"
